name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run fmt check
        run: cargo fmt -- --check

      - name: Run tests
        # --test-threads=1: tools_*_handler.rs integration tests hit the live
        # Open-Meteo API with no mocking; running them concurrently can trigger
        # real rate-limiting and fail even with retries (see tests/common/mod.rs)
        run: cargo test --all-features --verbose -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --cobertura --output-path coverage.xml --all-features -- --test-threads=1

      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Check binary size
        run: |
          SIZE=$(ls -lh target/release/open-meteo-mcp | awk '{print $5}')
          echo "Binary size: $SIZE"
          if [ ${SIZE%M} -gt 15 ]; then
            echo "Warning: Binary exceeds 15 MB"
          fi
